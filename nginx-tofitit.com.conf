# =============================================================================
# NativeOS 官网 Nginx 配置
# 域名: tofitit.com  (主域，跳 www.tofitit.com → tofitit.com)
# 文件路径: /etc/nginx/sites-available/tofitit.com
# 启用:   sudo ln -s /etc/nginx/sites-available/tofitit.com /etc/nginx/sites-enabled/
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP (port 80) → HTTPS 跳转
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name tofitit.com www.tofitit.com;

    # Let's Encrypt 续签验证必须放行，其他全部跳转
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://tofitit.com$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS (port 443) 主站
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tofitit.com www.tofitit.com;

    # ----- SSL 证书 (Let's Encrypt) -----
    ssl_certificate /etc/nginx/ssl/tofitit.com/www.tofitit.com.pem;
    ssl_certificate_key /etc/nginx/ssl/tofitit.com/www.tofitit.com.key;

    # ----- SSL/TLS 优化 -----
    ssl_protocols          TLSv1.2 TLSv1.3;
    ssl_ciphers            ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache      shared:SSL:10m;
    ssl_session_timeout    1d;
    ssl_session_tickets    off;

    # ----- 文档根目录 -----
    root  /usr/local/nginx/html/nativeos;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 1M;

    # ----- gzip 压缩 -----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ----- 安全响应头 -----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # CSP: 所有资源本地化, 不用 Google / 第三方 CDN
    # 注意: 'unsafe-inline' for style 是允许的，因为 index.html 用了 inline style="flex:..." 给 70/30 条形图
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;

    # ----- www → 非 www 跳转 -----
    if ($host = www.tofitit.com) {
        return 301 https://tofitit.com$request_uri;
    }

    # ----- 主路由 -----
    location / {
        try_files $uri $uri/ =404;
    }

    # ----- HTML: 不缓存（更新立即生效）-----
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # ----- robots.txt / sitemap.xml: 1 小时缓存 -----
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600" always; }
    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600" always; }

    # ----- 静态资源: 1 年不可变缓存 -----
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ----- JSON-LD 不被当 JS 执行 -----
    location ~* \.json$ {
        add_header Content-Type "application/ld+json" always;
        expires 1d;
    }

    # ----- favicon -----
    location = /favicon.ico { access_log off; log_not_found off; }

    # ----- 隐藏文件全部拒绝 -----
    location ~ /\. { deny all; access_log off; log_not_found off; }

    # ----- 错误页 -----
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}